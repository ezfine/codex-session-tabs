name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    timeout-minutes: 5
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
  package:
    timeout-minutes: 5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:icon
      - run: npm run package
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: dist/*-win32-x64.vsix
